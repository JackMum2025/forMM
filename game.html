<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>互动游戏 · Moral Fantastic</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Nunito', 'Segoe UI', 'Quicksand', system-ui, sans-serif;
      background: #ffffff;
      color: #2d4e1e;
      line-height: 1.5;
      min-height: 100vh;
    }
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid #d4e6ca;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .logo-area { display: flex; align-items: center; gap: 12px; }
    .logo-icon { font-size: 28px; animation: bounce 2s ease-in-out infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);} }
    .logo-text { font-size: 1.5rem; font-weight: 800; color: #2d4e1e; }
    .back-home { background: #eef5ea; color: #2d4e1e; text-decoration: none; padding: 8px 20px; border-radius: 40px; font-weight: 600; transition: 0.2s; }
    .back-home:hover { background: #7fa86a; color: white; transform: translateY(-2px); }
    .container { max-width: 900px; margin: 0 auto; padding: 24px 16px 40px; }
    h1 { color: #2d4e1e; margin-bottom: 8px; }
    .game-selector {
      background: white;
      border-radius: 32px;
      border: 1px solid #d4e6ca;
      padding: 20px;
      margin: 20px 0;
    }
    .selector-title { font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    select {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2ecd9;
      border-radius: 60px;
      font-size: 1rem;
      font-family: inherit;
      background: white;
      margin-bottom: 16px;
    }
    .game-container {
      background: #fefef9;
      border-radius: 24px;
      overflow: hidden;
      aspect-ratio: 16/9;
    }
    .game-container iframe { width: 100%; height: 100%; border: none; }
    .game-note { text-align: center; margin-top: 12px; color: #8aa67d; font-size: 0.85rem; }
    .nav-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-top: 32px;
      flex-wrap: wrap;
    }
    .nav-btn {
      background: #7fa86a;
      color: white;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 60px;
      font-weight: 600;
      transition: 0.2s;
      border: none;
      cursor: pointer;
    }
    .nav-btn:hover { background: #5b8c4e; transform: translateY(-2px); }
    .nav-btn.outline { background: white; color: #7fa86a; border: 2px solid #7fa86a; }
    .nav-btn.outline:hover { background: #eef5ea; }
    footer {
      text-align: center;
      padding: 24px;
      color: #9bb88b;
      font-size: 0.75rem;
      border-top: 1px solid #e2ecd9;
      margin-top: 20px;
    }
    @media (max-width: 600px) {
      .container { padding: 16px; }
      .game-selector { padding: 16px; }
      .nav-btn { padding: 10px 20px; font-size: 0.9rem; }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="sticky-header">
  <div class="logo-area">
    <div class="logo-icon">🍀</div>
    <div class="logo-text">Moral Fantastic</div>
  </div>
  <a href="zh.html" class="back-home">🏠 回到主页</a>
</div>

<div class="container">
  <h1>🎮 德育互动游戏</h1>
  <p style="color: #6b7c63; margin-bottom: 16px;">选择游戏，学习如何应对网络霸凌</p>

  <div class="game-selector">
    <div class="selector-title"><span>🛡️</span> 选择游戏</div>
    <select id="gameSelect" onchange="switchGame()">
      <option value="0">网络卫士 I</option>
      <option value="1">网络卫士 II</option>
      <option value="2">网络卫士 III</option>
    </select>
    <div class="game-container" id="gameContainer">
      <iframe src="cyber-guardian.html" allowfullscreen></iframe>
    </div>
    <div class="game-note" id="gameNote">🛡️ 网络卫士 · 拦截霸凌言论，守护网络世界！</div>
  </div>

  <div class="nav-buttons">
    <a href="video.html" class="nav-btn outline">← 上一项：教学视频</a>
    <a href="zh.html" class="nav-btn">🏠 回到主页</a>
    <a href="classroom.html" class="nav-btn outline">下一项：今日课堂 →</a>
  </div>
</div>

<footer>© 2026 Moral Fantastic · 德育如细雨，润物细无声</footer>

<script>
  // 游戏配置（只保留3个）
  const GAMES = [
    { src: 'cyber-guardian.html', note: '🛡️ 网络卫士 I · 拦截霸凌言论，守护网络世界！' },
    { src: 'cyber-guardian2.html', note: '🛡️ 网络卫士 II · 第二关挑战' },
    { src: 'cyber-guardian4.html', note: '🛡️ 网络卫士 III · 终极挑战' }
  ];

  function switchGame() {
    const index = parseInt(document.getElementById('gameSelect').value);
    const game = GAMES[index];
    const container = document.getElementById('gameContainer');
    container.innerHTML = `<iframe src="${game.src}" allowfullscreen></iframe>`;
    document.getElementById('gameNote').innerHTML = game.note;
  }
</script>
</body>
</html>
